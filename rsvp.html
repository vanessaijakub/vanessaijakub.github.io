<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RSVP | Vanessa & Jakub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="menu">
        <a href="index.html">
            Strona główna
        </a>

        <a href="ceremonia-wesele.html">
            Ceremonia i wesele
        </a>

        <a href="transport-i-noclegi.html">
            Transport i noclegi
        </a>

        <a href="rsvp.html" class="active">
            RSVP
        </a>
    </nav>


    <main class="page">

        <div class="content">

            <h1 class="page-title">
                RSVP
            </h1>

            <p class="page-subtitle">
                Dajcie nam znać, czy będziecie z nami
                w tym wyjątkowym dniu.
            </p>

            <div class="gold-line"></div>


            <form class="rsvp-form">

                <label for="name">
                    Imię i nazwisko
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Wasze imię i nazwisko"
                    required
                >


                <label for="attendance">
                    Czy będziecie z nami?
                </label>

                <select
                    id="attendance"
                    name="attendance"
                    required
                >

                    <option value="">
                        Wybierz odpowiedź
                    </option>

                    <option value="yes">
                        Tak, będziemy!
                    </option>

                    <option value="no">
                        Niestety nie będziemy mogli przyjechać
                    </option>

                </select>


                <label for="guests">
                    Liczba osób
                </label>

                <select
                    id="guests"
                    name="guests"
                >

                    <option value="1">
                        1 osoba
                    </option>

                    <option value="2">
                        2 osoby
                    </option>

                    <option value="3">
                        3 osoby
                    </option>

                    <option value="4">
                        4 osoby
                    </option>

                </select>


                <label for="message">
                    Dodatkowa wiadomość
                </label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="Np. informacje dotyczące diety, alergii itp."
                ></textarea>


                <button type="submit">
                    Potwierdź obecność
                </button>

            </form>

        </div>

    </main>
