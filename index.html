<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanessa &amp; Jakub | Biorą ślub!</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f5ef;
            color: #292724;
            font-family: Georgia, serif;
            text-align: center;
        }

        .welcome {
            padding: 40px;
        }

        .names {
            margin: 0;
            font-size: 64px;
            font-weight: normal;
            letter-spacing: 4px;
        }

        .subtitle {
            margin-top: 20px;
            font-size: 22px;
            font-style: italic;
        }

        .date {
            margin-top: 30px;
            font-size: 26px;
            letter-spacing: 5px;
        }

        .message {
            margin: 20px auto 0;
            max-width: 500px;
            font-size: 22px;
            font-style: italic;
            line-height: 1.7;
        }

        .line {
            width: 60px;
            height: 1px;
            margin: 30px auto;
            background: #b49b68;
        }

        @media (max-width: 600px) {
            .welcome {
                padding: 30px 20px;
            }

            .names {
                font-size: 42px;
                letter-spacing: 2px;
            }

            .date {
                font-size: 21px;
                letter-spacing: 3px;
            }

            .subtitle,
            .message {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="welcome">
        <h1 class="names">Vanessa &amp; Jakub</h1>

        <p class="subtitle">biorą ślub</p>

        <p class="date">28.08.2027</p>

        <div class="line"></div>

        <p class="message">
            Z ogromną radością zapraszamy Was<br>
            do wspólnego świętowania.
        </p>
    </main>
</body>
</html>
